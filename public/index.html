<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DropZone LFG</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><header><div class="brand"><div class="logo">DZ</div><div><h1>DropZone</h1><span>Fortnite LFG • community made</span></div></div><div class="status"><i></i> Live matchmaking</div></header>
<main><aside><button class="create" id="createRoom">＋ Create room</button><div class="label">ROOMS</div><div id="rooms"></div><div class="tips"><strong>How it works</strong><p>Join a room, find teammates, then hop into voice chat.</p></div></aside>
<section class="chat"><div class="chathead"><div><h2 id="roomTitle"># General</h2><p id="roomMeta">Looking for teammates</p></div><div class="roomactions"><button id="muteBtn">🎙️ Mute</button><button id="deleteCurrent" class="danger hidden">Delete room</button><button id="leaveBtn" class="danger">Leave</button></div></div><div id="messages" class="messages"></div><form id="chatForm"><input id="message" maxlength="500" placeholder="Message the room…" autocomplete="off"><button>Send</button></form></section>
<aside class="people"><div class="label">IN VOICE <span id="count">0</span></div><div id="people"></div><div class="voicebox"><div class="wave">•••</div><b>Voice chat</b><small>Peer-to-peer audio</small><button id="voiceBtn">Join voice</button></div></aside></main></div>
<div id="modal" class="modal hidden"><div class="card"><h2>Create an LFG room</h2><input id="newRoom" placeholder="e.g. duos-need-1" maxlength="40"><button id="confirmRoom">Create room</button><button class="ghost" id="cancelRoom">Cancel</button></div></div>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
