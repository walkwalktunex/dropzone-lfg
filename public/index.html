<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>DropZone LFG</title><link rel="stylesheet" href="/style.css"/></head><body>
<header><div><h1>DROPZONE</h1><p>Fortnite LFG • chat • voice</p></div><div id="account"></div></header>
<main>
<section id="auth" class="panel"><div class="tabs"><button data-tab="login">Login</button><button data-tab="register">Create account</button></div><form id="loginForm" class="authForm"><input id="loginEmail" type="email" placeholder="Email" required/><input id="loginPassword" type="password" placeholder="Password" required/><button>Log in</button></form><form id="registerForm" class="authForm hidden"><input id="regUsername" placeholder="Username" maxlength="32" required/><input id="regEmail" type="email" placeholder="Email" required/><input id="regPassword" type="password" placeholder="Password (8+ chars)" required/><button>Create account</button></form><div id="authMsg"></div></section>
<section id="app" class="hidden">
<div class="toolbar"><button id="newRoom">＋ Create room</button><button id="refreshRooms">↻ Refresh</button><button id="logout">Log out</button><span id="status"></span></div>
<div class="layout"><aside class="rooms panel"><h2>LFG Rooms</h2><div id="roomList"></div></aside><section class="chat panel"><div id="roomHeader"><h2>Select a room</h2></div><div id="presence"></div><div id="messages"></div><form id="chatForm"><input id="chatInput" autocomplete="off" placeholder="Join a room to chat" disabled/><button disabled>Send</button></form><div class="voice"><button id="mic" disabled>🎙️ Mic off</button><span id="voiceStatus">Voice: not connected</span></div></section></div>
</section>
</main>
<dialog id="roomDialog"><form method="dialog" id="roomForm"><h2>Create a room</h2><input id="roomName" placeholder="Room name" maxlength="80" required/><textarea id="roomDescription" placeholder="What are you looking for?" maxlength="240"></textarea><div class="grid"><label>Max players<select id="roomMax"><option>2</option><option>3</option><option selected>4</option><option>8</option><option>16</option></select></label><label>Mode<select id="roomMode"><option>Battle Royale</option><option>Zero Build</option><option>Ranked</option><option>Reload</option><option>Creative</option></select></label><label>Region<select id="roomRegion"><option>NA-East</option><option>NA-West</option><option>EU</option><option>OCE</option><option>BR</option><option>ME</option><option>Asia</option></select></label></div><label class="check"><input id="roomPrivate" type="checkbox"/> Private room</label><input id="roomPassword" type="password" placeholder="Room password (private only)" minlength="4"/><div class="actions"><button value="cancel">Cancel</button><button id="createRoomBtn" value="default">Create room</button></div><div id="roomMsg"></div></form></dialog>
<dialog id="modDialog"><div class="mod"><h2>Moderation</h2><div id="reports"></div><button id="closeMod">Close</button></div></dialog>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
